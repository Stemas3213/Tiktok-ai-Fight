  .nm.l { left: 56px; } .nm.r { right: 56px; }

  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, #000a 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #lines { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen;
    background: repeating-conic-gradient(from 0deg at 50% 50%, #fff 0deg 1.2deg, transparent 1.2deg 6deg);
    -webkit-mask-image: radial-gradient(ellipse at center, transparent 30%, #000 80%); mask-image: radial-gradient(ellipse at center, transparent 30%, #000 80%); }
